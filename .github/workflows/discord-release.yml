name: Discord Release Notes

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Send bilingual release notes
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          node --input-type=module -e "import { sendRelease } from './.github/scripts/notify-discord-release.mjs'; await sendRelease();"
