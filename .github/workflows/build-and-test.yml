name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Tests and WinUI x64 build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Run tests and build verification
        shell: pwsh
        run: .\scripts\test-all.ps1 -ArtifactsDirectory artifacts\verification
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: artifacts/verification/TestResults/**/*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-x64-${{ github.sha }}
          path: |
            artifacts/verification/Smoke/*
            WinUI3/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/**
            !WinUI3/bin/**/*.pdb
          if-no-files-found: error
          retention-days: 7
