name: Build and Test

on:
  # Every branch push runs, so a feature branch has a result before its pull request.
  # Documentation-only pushes are skipped; pull requests always run.
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Tests and WinUI x64 build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # Runs first: its rebuild cleans shared intermediate files, and test-all then rebuilds
      # the outputs that are uploaded below.
      - name: Check code style (unnecessary usings and other .editorconfig rules)
        shell: pwsh
        run: .\scripts\check-code-style.ps1 -OutputDirectory artifacts\code-style
      - name: Run tests and build verification
        shell: pwsh
        run: .\scripts\test-all.ps1 -ArtifactsDirectory artifacts\verification
      # Hosted runners start at 1024x768; the wide-layout tests need a larger screen.
      - name: Set the screen resolution
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Warning "Could not change the resolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          "Screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Size)"
      # The UI tests start the built app on the runner's desktop and drive it with UI Automation.
      - name: Run UI smoke tests
        shell: pwsh
        run: .\scripts\test-ui.ps1 -Application artifacts\verification\ReleaseSource
      - name: Report UI text by language
        if: always()
        shell: pwsh
        run: .\scripts\report-translations.ps1
      - name: Build standalone Developer Tools
        shell: pwsh
        run: .\scripts\package-developer-tools.ps1 -OutputDirectory artifacts\developer-tools
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: |
            artifacts/verification/TestResults/**/*
            tests/UI.Tests/bin/Release/*/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified build outputs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: verified-windows-x64-${{ github.sha }}
          path: |
            artifacts/verification/Smoke/*
            src/WinUI3/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/**
            !src/WinUI3/bin/**/*.pdb
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified release package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-package-${{ github.sha }}
          path: |
            artifacts/verification/ReleasePackage/*.zip
            artifacts/verification/ReleasePackage/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone Developer Tools package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: verified-developer-tools-${{ github.sha }}
          path: |
            artifacts/developer-tools/*.zip
            artifacts/developer-tools/*.sha256
          if-no-files-found: error
          retention-days: 7
