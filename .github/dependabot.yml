# Weekly pull requests for newer NuGet packages and GitHub Actions. Minor and patch updates are grouped
# into one pull request per ecosystem; major NuGet updates (such as a new Windows App SDK or xunit
# generation) are left for a deliberate upgrade. Security updates still arrive as they are published.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
